syntax = "proto3";

import "v1/models/model_common.proto";

option go_package = "github.com/rsmrtk/finance-engine/api/v1/pb";

message CategoryModel {
  message Category {
    string id = 1;
    string name = 2;
    string icon_name = 3;
    string color_hex = 4;
    TransactionTypeModel.TransactionType type = 5;
    bool is_default = 6;
  }
}
