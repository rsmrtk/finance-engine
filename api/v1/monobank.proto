syntax = "proto3";

import "v1/models/model_monobank.proto";

option go_package = "github.com/rsmrtk/finance-engine/api/v1/pb";

service MonobankService {
  // ConnectMonobank validates the personal token against Monobank's API,
  // stores it encrypted, and registers our webhook so new transactions get
  // pushed to us automatically.
  rpc ConnectMonobank(ConnectMonobankRequest) returns (MonobankStatusReply);

  rpc MonobankStatus(MonobankStatusRequest) returns (MonobankStatusReply);

  rpc DisconnectMonobank(DisconnectMonobankRequest) returns (DisconnectMonobankReply);
}

// ====================
// ConnectMonobank
// ====================
message ConnectMonobankRequest {
  string personal_token = 1; // Generated by the user at https://api.monobank.ua/.
}

// ====================
// MonobankStatus
// ====================
message MonobankStatusRequest {}

message MonobankStatusReply {
  MonobankConnectionModel.Connection connection = 1;
}

// ====================
// DisconnectMonobank
// ====================
message DisconnectMonobankRequest {}

message DisconnectMonobankReply {}
