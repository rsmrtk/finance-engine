apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: finance-engine
type: Opaque
stringData:
  JWT_SECRET: dev-secret-change-me
  APPLE_BUNDLE_ID: "com.rsmrtk.finance-rsmrtk"
  MONOBANK_TOKEN_KEY: dev-monobank-key-change-me
  # From Google Cloud Console -> Credentials -> OAuth Client ID (Web
  # application). Empty is fine locally until Google Sign-In is wired up
  # on the frontend — only /api/auth/google needs it.
  GOOGLE_CLIENT_ID: ""
  # ADMIN_PASSWORD and LIQPAY_PUBLIC_KEY/LIQPAY_PRIVATE_KEY are deliberately
  # NOT declared here: `kubectl apply` re-applies this whole stringData
  # block on every redeploy, which would silently clobber a real value
  # back to whatever placeholder lived here (this bit us once already with
  # ADMIN_PASSWORD). Set them out-of-band and they'll survive redeploys:
  # kubectl create secret generic backend-secrets -n finance-engine \
  #   --from-literal=ADMIN_PASSWORD=<real value> --dry-run=client -o yaml | kubectl apply -f -

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-engine-api
  namespace: finance-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-engine-api
  template:
    metadata:
      labels:
        app: finance-engine-api
    spec:
      containers:
        - name: api
          image: finance-engine:local
          imagePullPolicy: Never # Loaded into kind via `kind load docker-image`, never pulled from a registry.
          ports:
            - containerPort: 8443
            - containerPort: 8080
          env:
            - name: GRPC_ADDRESS
              value: ":8443"
            - name: WEBHOOK_ADDRESS
              value: ":8080"
            - name: POSTGRES_DSN
              value: "postgres://finance:finance@postgres:5432/finance_engine?sslmode=disable"
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: NBU_EXCHANGE_URL
              value: "https://bank.gov.ua/NBU_Exchange/exchange?json"
            - name: DEV_MODE
              value: "true" # kind is local-only; never set this on Render/production.
            - name: PUBLIC_BASE_URL
              # ngrok tunnel to localhost:8080, started manually (`ngrok http 8080`)
              # for testing LiqPay/Monobank webhooks without a real cloud deploy.
              # This is a free-tier ngrok URL — it changes every time the tunnel
              # restarts unless a reserved static domain is used instead.
              value: "https://ungreased-salary-riptide.ngrok-free.dev"
            - name: CORS_ALLOWED_ORIGIN
              value: "http://localhost:5173" # Vite dev server; update once finance-ui is deployed somewhere real.
            - name: ADMIN_DASHBOARD_ORIGIN
              value: "http://localhost:5174" # finance-dashboard's Vite dev server.
            - name: OLLAMA_URL
              value: "http://host.docker.internal:11434" # Ollama runs natively on the Mac (Metal GPU), not in-cluster.
            - name: OLLAMA_MODEL
              value: "llama3.1:8b"
          envFrom:
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: finance-engine-api
  namespace: finance-engine
spec:
  type: NodePort
  selector:
    app: finance-engine-api
  ports:
    - name: grpc
      port: 8443
      targetPort: 8443
      nodePort: 30443
    - name: webhook
      port: 8080
      targetPort: 8080
      nodePort: 30080
