apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: finance-engine
type: Opaque
stringData:
  JWT_SECRET: dev-secret-change-me
  APPLE_BUNDLE_ID: "-01.finance-rsmrtk"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-engine-api
  namespace: finance-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-engine-api
  template:
    metadata:
      labels:
        app: finance-engine-api
    spec:
      containers:
        - name: api
          image: finance-engine:local
          imagePullPolicy: Never # Loaded into kind via `kind load docker-image`, never pulled from a registry.
          ports:
            - containerPort: 8443
          env:
            - name: GRPC_ADDRESS
              value: ":8443"
            - name: POSTGRES_DSN
              value: "postgres://finance:finance@postgres:5432/finance_engine?sslmode=disable"
            - name: NBU_EXCHANGE_URL
              value: "https://bank.gov.ua/NBU_Exchange/exchange?json"
            - name: DEV_MODE
              value: "true" # kind is local-only; never set this on Render/production.
          envFrom:
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: finance-engine-api
  namespace: finance-engine
spec:
  type: NodePort
  selector:
    app: finance-engine-api
  ports:
    - port: 8443
      targetPort: 8443
      nodePort: 30443
