apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: finance-engine
type: Opaque
stringData:
  POSTGRES_USER: finance
  POSTGRES_PASSWORD: finance
  POSTGRES_DB: finance_engine

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: finance-engine
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: finance-engine
spec:
  replicas: 1
  strategy:
    type: Recreate # Single ReadWriteOnce volume; don't try to run two pods at once.
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "finance"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: finance-engine
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
